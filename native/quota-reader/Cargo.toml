[package]
name = "codex-quota-reader"
version = "0.2.16"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
age = { version = "0.11", default-features = false }
base64 = "0.22"
dirs = "6"
zeroize = "1.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "native-tls", "system-proxy", "http2", "rustls-tls", "rustls-tls-native-roots"] }
native-tls = "0.2"
hyper-util = { version = "=0.1.20", default-features = false, features = ["client-legacy"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_Networking_WinHttp"] }

[dev-dependencies]
dotenvy = "=0.15.7"
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# Passive diagnostics in the exact pinned system proxy matcher.
[patch.crates-io]
hyper-util = { path = "upstream/hyper-util-0.1.20" }
