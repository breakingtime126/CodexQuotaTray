name: Build and release Windows tray
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Four-part version matching Directory.Build.props (for example 0.2.34.0)'
        required: true
        type: string
      replace_draft_manifest:
        description: 'Replace only the approved old 0.2.34.0 draft update.json'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: codexquotatray-stable-release
  cancel-in-progress: false
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  build:
    if: github.repository == 'breakingtime126/CodexQuotaTray' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      version: ${{ steps.validate.outputs.version }}
      sha: ${{ steps.validate.outputs.sha }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      exe_sha256: ${{ steps.hash.outputs.exe_sha256 }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and main ancestry
        id: validate
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: ./scripts/ci-validate.ps1
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: '8.0.427'
      - name: Pin SDK and official package source
        shell: pwsh
        run: |
          '{"sdk":{"version":"8.0.427","rollForward":"disable"}}' | Set-Content global.json
          '<configuration><packageSources><clear/><add key="nuget.org" value="https://api.nuget.org/v3/index.json"/></packageSources></configuration>' | Set-Content NuGet.Config
          if ((dotnet --version) -ne '8.0.427') { throw 'Unexpected SDK' }
      - name: Core tests and net48 single EXE
        shell: bash
        run: bash scripts/build-lightweight.sh
      - name: Check binary version and hash
        id: hash
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.validate.outputs.version }}
        run: |
          $exe = Get-Item artifacts/lightweight/CodexQuotaTray.exe
          if ($exe.VersionInfo.FileVersion -ne $env:EXPECTED_VERSION) { throw 'EXE version mismatch' }
          "exe_sha256=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: State lifecycle-test limitation (not a passed test)
        shell: pwsh
        run: |
          'Windows lifecycle smoke: NOT RUN. Hosted Windows runner is administrator; production requires unelevated installation. No production privilege gate is bypassed. Core tests above are independent.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: exe-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/lightweight/CodexQuotaTray.exe
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: dist
      - name: Sign exact tested build, verify key, and remove private temporary file
        env:
          UPDATE_SIGNING_KEY_PEM: ${{ secrets.UPDATE_SIGNING_KEY_PEM }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_EXE_SHA256: ${{ needs.build.outputs.exe_sha256 }}
        run: python3 scripts/ci-sign.py
      - name: Upload paired assets to draft, verify downloads, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
          REPLACE_DRAFT_MANIFEST: ${{ inputs.replace_draft_manifest && 'true' || 'false' }}
        run: python3 scripts/ci-publish.py
